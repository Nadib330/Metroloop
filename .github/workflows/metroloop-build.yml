name: MetroLoop APK Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Debug + Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build FOSS debug + release
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --console=plain --no-daemon \
            :app:assembleFossDebug :app:assembleFossRelease \
            --warning-mode summary 2>&1 | tee build.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Sign release APK with a throwaway key
        if: always()
        run: |
          set -euo pipefail
          UNSIGNED=$(ls app/build/outputs/apk/foss/release/*-unsigned.apk 2>/dev/null | head -1 || true)
          if [ -z "${UNSIGNED}" ]; then
            echo "No unsigned release APK produced, skipping signing"
            exit 0
          fi
          BT=$(ls -d "${ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"
          keytool -genkeypair -keystore metroloop.jks -storepass metroloop -keypass metroloop \
            -alias metroloop -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=MetroLoop, O=rpooi3 studio, C=BD" >/dev/null 2>&1
          mkdir -p dist
          "$BT/zipalign" -f -p 4 "$UNSIGNED" dist/release-aligned.apk
          "$BT/apksigner" sign --ks metroloop.jks --ks-pass pass:metroloop \
            --key-pass pass:metroloop --v1-signing-enabled true --v2-signing-enabled true \
            --out dist/app-foss-release.apk dist/release-aligned.apk
          rm -f dist/release-aligned.apk
          ls -l dist

      - name: Collect debug APKs
        if: always()
        run: |
          mkdir -p dist
          find app/build/outputs/apk -name "*debug*.apk" -exec cp {} dist/ \; 2>/dev/null || true
          ls -l dist

      - name: Publish build log and APKs back to the branch
        if: always()
        run: |
          set -uo pipefail
          mkdir -p .ci
          {
            echo "run=${GITHUB_RUN_ID}"
            echo "build_exit=${{ steps.build.outputs.exit }}"
            echo "--- dist ---"
            ls -l dist 2>/dev/null || true
            echo "--- apk outputs ---"
            find app/build/outputs/apk -name "*.apk" -printf "%p %s bytes\n" 2>/dev/null || true
          } > .ci/status.txt
          if [ -f build.log ]; then cp build.log .ci/build.log; fi

          git config user.name "MetroLoop CI"
          git config user.email "ci@users.noreply.github.com"
          git add -f .ci/status.txt
          if [ -f .ci/build.log ]; then git add -f .ci/build.log; fi
          for f in dist/*.apk; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          git status --short | head -20
          git commit -m "ci: build output for run ${GITHUB_RUN_ID}" || echo "nothing to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}" || git push --force origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metroloop-apks
          path: dist/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if the Gradle build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "Gradle build failed; see .ci/build.log on the branch."
          exit 1
